run_name: heldout-sft-eval-vllm-lora-trained-qwen15b
workload:
  name: jsonl_eval
  dataset_path: artifacts/sft/public_domain_large/eval_requests.jsonl
  request_count: 20
  sessions: 10
  tenants: 2
  max_tokens: 64
cache:
  model: activated_lora
  block_size: 8
backend:
  kind: vllm
  base_url: http://localhost:8000/v1
  api_key: EMPTY
  model: Qwen/Qwen2.5-1.5B-Instruct
  adapter_model_names:
    qa: qa-lora
    json: json-lora
    summary: summary-lora
    code: code-lora
  temperature: 0.0
  ttft_slo_ms: 1000
  e2e_slo_ms: 12000
  scrape_metrics: true
  metrics_url: http://localhost:8000/metrics
  extra_body: {}
