run_name: large-model-vllm-streaming
output_dir: artifacts/runs
workload:
  name: jsonl_eval
  dataset_path: data/eval/public_domain_eval_xlarge.jsonl
  request_count: 500
  sessions: 20
  tenants: 4
  max_tokens: 64
cache:
  model: activated_lora
  block_size: 8
router:
  policy: cache_aware
backend:
  kind: vllm
  base_url: http://localhost:8000/v1
  api_key: EMPTY
  # Override with the served large model. Examples:
  # Qwen/Qwen2.5-7B-Instruct
  # Qwen/Qwen2.5-14B-Instruct
  # Qwen/Qwen2.5-72B-Instruct
  model: Qwen/Qwen2.5-7B-Instruct
  temperature: 0.0
  stream: true
  ttft_slo_ms: 1500
  e2e_slo_ms: 20000
  scrape_metrics: true
  metrics_url: http://localhost:8000/metrics
  max_concurrency: 4
  request_spacing_ms: 0
  extra_body: {}
matrix:
  # Base-only runs are the cheapest way to measure how cache locality and SLOs
  # change with model scale. Use model_family_vllm_template.yaml after matching
  # specialist and multitask adapters exist for the large model.
  strategies: [base]
  concurrencies: [1, 2, 4, 8]
  workloads: [jsonl_eval]
  caches: [activated_lora]
  adapter_counts: [4]
  tenants: [4]
  isolation_scopes: [trust_group]
  seeds: [17, 23, 31]
  overlap_fractions: [0.25, 0.5, 0.75, 0.95]
  models:
    - name: Qwen/Qwen2.5-7B-Instruct
      alias: qwen25-7b
    # Add larger served models after provisioning enough GPU memory:
    # - name: Qwen/Qwen2.5-14B-Instruct
    #   alias: qwen25-14b
    # - name: Qwen/Qwen2.5-72B-Instruct
    #   alias: qwen25-72b
