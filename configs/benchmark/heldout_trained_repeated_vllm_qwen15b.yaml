run_name: heldout-trained-repeated-vllm-qwen15b
output_dir: artifacts/runs
workload:
  name: jsonl_eval
  dataset_path: artifacts/sft/public_domain_large/eval_requests.jsonl
  request_count: 20
  sessions: 10
  tenants: 2
  max_tokens: 64
cache:
  model: activated_lora
  block_size: 8
router:
  policy: cache_aware
backend:
  kind: vllm
  base_url: http://localhost:8000/v1
  api_key: EMPTY
  model: Qwen/Qwen2.5-1.5B-Instruct
  adapter_model_names:
    qa: qa-lora
    json: json-lora
    summary: summary-lora
    code: code-lora
    multitask: multitask-lora
  temperature: 0.0
  ttft_slo_ms: 1000
  e2e_slo_ms: 12000
  scrape_metrics: true
  metrics_url: http://localhost:8000/metrics
  extra_body: {}
matrix:
  routers: [semantic, cache_aware]
  caches: [standard_lora, activated_lora, copy_on_write]
  workloads: [jsonl_eval]
  seeds: [17, 23, 31]
