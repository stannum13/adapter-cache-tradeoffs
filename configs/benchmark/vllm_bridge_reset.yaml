# Minimal Branch A -> G8 real-server bridge.
#
# This config is intentionally small and reset-isolated. It requires a vLLM
# LoRA server only when actually run; dry-run and budget checks do not need GPU.
run_name: vllm-bridge-reset
output_dir: artifacts/runs
workload:
  name: controlled_overlap
  request_count: 24
  shared_document_count: 4
  sessions: 8
  tenants: 4
  max_tokens: 48
  seed: 17
  document_tokens: 180
  shared_prefix_fraction: 0.75
router:
  policy: cache_aware
  seed: 17
cache:
  model: activated_lora
  condition: warm
  block_size: 8
  isolation_scope: trust_group
backend:
  kind: vllm
  base_url: http://localhost:8000/v1
  api_key: EMPTY
  model: Qwen/Qwen2.5-1.5B-Instruct
  temperature: 0.0
  stream: true
  ttft_slo_ms: 1000
  e2e_slo_ms: 12000
  scrape_metrics: true
  metrics_url: http://localhost:8000/metrics
  max_concurrency: 1
  request_spacing_ms: 0
  server_reset_command: MODEL=${MODEL:-Qwen/Qwen2.5-1.5B-Instruct} MAX_MODEL_LEN=${MAX_MODEL_LEN:-4096} GPU_MEMORY_UTILIZATION=${GPU_MEMORY_UTILIZATION:-0.85} LORA_MODULES="${LORA_MODULES:?Set LORA_MODULES with qa-lora/json-lora/summary-lora/code-lora/multitask-lora}" ./scripts/restart_local_vllm_lora.sh
  server_reset_timeout_s: 420
  server_warmup_url: http://localhost:8000/health
  server_warmup_timeout_s: 420
  server_warmup_interval_s: 5
  extra_body: {}
matrix:
  strategies: [specialists, multitask]
  concurrencies: [1]
  workloads: [controlled_overlap, mixed_tasks_same_doc, low_overlap_control]
  caches: [activated_lora]
  cache_conditions: [warm, prefix_disabled]
  overlap_fractions: [0.75]
  adapter_counts: [4]
  tenants: [4]
  isolation_scopes: [trust_group]
  seeds: [17]
