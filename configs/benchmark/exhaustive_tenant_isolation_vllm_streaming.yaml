run_name: exhaustive-tenant-isolation-vllm-streaming
output_dir: artifacts/runs
workload:
  name: controlled_overlap
  request_count: 60
  sessions: 12
  tenants: 4
  max_tokens: 64
  document_tokens: 240
  shared_prefix_fraction: 0.75
cache:
  model: activated_lora
  block_size: 8
router:
  policy: cache_aware
backend:
  kind: vllm
  base_url: http://localhost:8000/v1
  api_key: EMPTY
  model: Qwen/Qwen2.5-1.5B-Instruct
  temperature: 0.0
  stream: true
  ttft_slo_ms: 1000
  e2e_slo_ms: 12000
  scrape_metrics: true
  metrics_url: http://localhost:8000/metrics
  max_concurrency: 8
  request_spacing_ms: 0
  extra_body: {}
matrix:
  strategies: [specialists, multitask]
  concurrencies: [8]
  workloads: [controlled_overlap]
  caches: [activated_lora]
  overlap_fractions: [0.75]
  adapter_counts: [4]
  tenants: [1, 2, 4, 8]
  isolation_scopes: [trust_group, tenant]
  seeds: [17, 23]
